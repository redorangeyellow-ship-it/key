    <g transform="translate(5, 5)"><rect width="140" height="60" rx="6" fill="#4a4e69" stroke="#444" stroke-width="1"/><text x="70" y="35" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">123</text></g>

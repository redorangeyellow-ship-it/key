    <g transform="translate(765, 5)"><rect width="134" height="60" rx="6" fill="#2d2d34" stroke="#444" stroke-width="1"/><text x="67" y="36" fill="#fff" font-size="18" text-anchor="middle">.</text><circle cx="124" cy="12" r="3" fill="#00adb5"/></g>
